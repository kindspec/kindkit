[project]
name = "kindkit"
version = "0.2.0"
description = "The shared conformance machinery behind every kindspec kind"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Cameron Brooks", email = "cambrooks3393@gmail.com" }]
keywords = ["conformance", "fixtures", "git", "merge", "specification", "testing"]
# The WHEEL contains only `kindkit`, which is MIT. The repository as a whole is
# licensed per directory -- the case-tree conventions and schemas are CC0-1.0 --
# and that split is deliberate: a case tree and the schema describing it must be
# vendorable into an implementation in any language, under any licence, with no
# obligation attached. See LICENSE and LICENSES/.
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/kindspec/kindkit"
Source = "https://github.com/kindspec/kindkit"
Issues = "https://github.com/kindspec/kindkit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kindkit"]
# `Typing :: Typed` above is a claim, and PEP 561 says the marker file is what
# makes it true for a consumer's type checker. Without it the classifier is a
# number nobody produced.
artifacts = ["kindkit/py.typed"]

# The sdist carries the tests and the toy case tree deliberately. A kit whose
# defining property is "it can fail" should ship the fixtures that prove it.
[tool.hatch.build.targets.sdist]
include = [
  "/kindkit",
  "/tests",
  # `just mutants` is a recipe the justfile ships, so the script it runs has to
  # ship too: an unpacked sdist that carries the recipe and not the tool fails
  # at the one command that proves the suite can fail.
  "/tools",
  # The convention and its schema, with their CC0 LICENSE. tools/ reads
  # case-tree/expect.schema.json, so an sdist without it ships a validator
  # and a mutation gate that cannot load the schema they check against.
  "/case-tree",
  "/README.md",
  "/LICENSE",
  "/LICENSES",
  "/justfile",
  "/pyproject.toml",
  # tests/test_tooling.py checks the ruff hook against the ruff the project
  # locks, so it reads both files. Without them the shipped suite fails.
  "/uv.lock",
  "/.pre-commit-config.yaml",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is on the path so the toy kind imports as `kvkind`. The kit itself is
# imported from the repository root and never reaches for anything under here.
pythonpath = [".", "tests"]
